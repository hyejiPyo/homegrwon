name: Deploy Infrastructure and Test AI Gateway

on:
  push:
    branches:
      - main

jobs:
  terraform-and-test:
    name: Terraform Apply & AI Gateway Test
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python 환경 세팅 및 라이브러리 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      # 3. Terraform CLI 세팅
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 5. Terraform Apply (EC2 배포)
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # 6. EC2 부팅 및 LiteLLM 도커 컨테이너 기동 대기
      - name: Wait for Instances & Gateway Initialization
        run: sleep 45

      # 7. Terraform Output에서 Public IP 추출
      - name: Get AI Gateway IP
        id: get-ip
        run: |
          GATEWAY_IP=$(terraform output -raw ai_gateway_public_ip)
          echo "GATEWAY_IP=$GATEWAY_IP" >> $GITHUB_ENV

      # 8. AI 게이트웨이 연동 테스트 실행
      - name: Run AI Gateway Integration Test
        run: python test_app.py
        env:
          AI_GATEWAY_IP: ${{ env.GATEWAY_IP }}